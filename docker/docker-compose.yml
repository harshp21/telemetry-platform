x-common-app-env: &common-app-env
  NODE_ENV: production
  # Least-privilege role (NOSUPERUSER, NOBYPASSRLS, non-owner) so RLS enforces.
  # Created by docker/postgres/init/01-app-role.sql on first container start.
  DATABASE_URL: postgresql://telemetry_app:telemetry_app_local_dev@postgres:5432/telemetry
  REDIS_URL: redis://redis:6379
  OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
  LOG_LEVEL: info

x-http-healthcheck: &http-healthcheck
  test:
    - CMD-SHELL
    - >-
      node -e "const u = 'http://127.0.0.1:' + process.env.PORT + '/health'; fetch(u).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 15s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the telemetry_app role on first start. Nothing in this stack runs Prisma
      # migrations, so the role cannot come from v1_4_app_role_non_superuser here.
      # Re-run requires `docker compose -f docker/docker-compose.yml down -v`.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
    environment:
      <<: *common-app-env
      # auth-service has its own least-privilege role rather than the shared telemetry_app:
      # it is the only role granted EXECUTE on the pre-authentication resolvers, which read
      # past the "User" tenant policy by design. Created by
      # docker/postgres/init/01-app-role.sql on first container start.
      #
      # The resolvers themselves are NOT created in this stack -- nothing here runs
      # migrations, and the tables do not exist either -- so auth's database paths are
      # non-functional in compose. /health, the only thing test:smoke:compose exercises,
      # does not touch the database.
      DATABASE_URL: postgresql://telemetry_auth_app:telemetry_auth_app_local_dev@postgres:5432/telemetry
      PORT: "3001"
      JWT_SECRET: test-jwt-secret-value-with-at-least-32-characters
      JWT_REFRESH_SECRET: test-refresh-secret-value-with-at-least-32-chars
      JWT_ACCESS_TTL_SECONDS: "900"
      JWT_REFRESH_TTL_SECONDS: "604800"
      BCRYPT_ROUNDS: "10"
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: Lax
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *http-healthcheck

  usage-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: usage-service
    environment:
      <<: *common-app-env
      PORT: "3002"
      INTERNAL_API_SECRET: ci-internal-api-secret-with-at-least-32-chars
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *http-healthcheck

  billing-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: billing-service
    environment:
      <<: *common-app-env
      PORT: "3004"
      INTERNAL_API_SECRET: ci-internal-api-secret-with-at-least-32-chars
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *http-healthcheck

  analytics-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: analytics-service
    environment:
      <<: *common-app-env
      PORT: "3005"
      # Written inline, not added to the *common-app-env anchor: the four services that already
      # carry it write it inline, and moving it into the anchor would hand the secret to every
      # service including ones that have their own line. Required by analytics' env schema with
      # no default since S-9, so an analytics-service without it crash-loops.
      INTERNAL_API_SECRET: ci-internal-api-secret-with-at-least-32-chars
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *http-healthcheck

  worker-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: worker-service
    environment:
      <<: *common-app-env
      # worker-service has its own least-privilege role rather than the shared telemetry_app:
      # it is the only role granted EXECUTE on the cross-tenant unbilled-usage resolver, which
      # reads past the "UsageLine" tenant policy by design (T-042). Created by
      # docker/postgres/init/01-app-role.sql on first container start.
      #
      # The resolver itself is NOT created in this stack -- nothing here runs migrations, and
      # the tables do not exist either -- so worker's database paths, including the nightly
      # invoice job, are non-functional in compose. /health, the only thing test:smoke:compose
      # exercises, does not touch the database.
      DATABASE_URL: postgresql://telemetry_worker_app:telemetry_worker_app_local_dev@postgres:5432/telemetry
      PORT: "3003"
      INTERNAL_API_SECRET: ci-internal-api-secret-with-at-least-32-chars
      # Same value gateway holds at :175 below. Required by worker's env schema with no default,
      # so a worker without it does not start.
      BILLING_SERVICE_URL: http://billing-service:3004
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *http-healthcheck

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: gateway
    environment:
      NODE_ENV: production
      PORT: "3100"
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
      LOG_LEVEL: info
      JWT_SECRET: test-jwt-secret-value-with-at-least-32-characters
      INTERNAL_API_SECRET: ci-internal-api-secret-with-at-least-32-chars
      AUTH_SERVICE_URL: http://auth-service:3001
      USAGE_SERVICE_URL: http://usage-service:3002
      BILLING_SERVICE_URL: http://billing-service:3004
      ANALYTICS_SERVICE_URL: http://analytics-service:3005
      RATE_LIMIT_MAX: "1000"
      RATE_LIMIT_WINDOW_MS: "1000"
      INGESTION_RATE_LIMIT_MAX: "5000"
    ports:
      - "3100:3100"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      usage-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    healthcheck: *http-healthcheck

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  grafana_data:
